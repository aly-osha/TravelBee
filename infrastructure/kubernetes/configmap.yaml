apiVersion: v1
kind: ConfigMap
metadata:
  name: travelbee-config
  namespace: travelbee-prod
data:
  NODE_ENV: "production"
  PORT: "5000"
  REALTIME_PORT: "5001"
  API_URL: "http://travelbee-api-svc:5000"
  MONGO_URI: "mongodb://travelbee-mongodb-svc:27017/travelbee"
  REDIS_URL: "redis://travelbee-redis-svc:6379"
