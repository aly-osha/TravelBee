apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: travelbee-api-hpa
  namespace: travelbee-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: travelbee-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: travelbee-realtime-hpa
  namespace: travelbee-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: travelbee-realtime
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
