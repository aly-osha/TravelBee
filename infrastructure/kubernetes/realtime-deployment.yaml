apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelbee-realtime
  namespace: travelbee-prod
  labels:
    app: travelbee-realtime
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: travelbee-realtime
  template:
    metadata:
      labels:
        app: travelbee-realtime
    spec:
      containers:
      - name: realtime
        image: travelbee-realtime:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: travelbee-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: travelbee-secrets
              key: JWT_SECRET
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          tcpSocket:
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
