apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelbee-worker
  namespace: travelbee-prod
  labels:
    app: travelbee-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelbee-worker
  template:
    metadata:
      labels:
        app: travelbee-worker
    spec:
      containers:
      - name: worker
        image: travelbee-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: travelbee-config
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: travelbee-secrets
              key: MONGO_URI
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: travelbee-secrets
              key: REDIS_URL
        resources:
          limits:
            cpu: "150m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
